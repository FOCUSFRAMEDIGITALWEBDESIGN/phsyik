<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kartbahn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menü -->
    <div id="menu" class="panel hidden">
        <header class="menu-head">
            <div class="brand"><span class="flag"></span>KART<b>BAHN</b></div>
            <nav class="tabs">
                <button class="tab active" data-tab="drive">Fahren</button>
                <button class="tab" data-tab="ranking">Rangliste</button>
                <button class="tab" data-tab="profile">Profil</button>
            </nav>
            <button class="close" id="btn-close" title="Schließen">✕</button>
        </header>

        <section class="page" id="page-drive">
            <div class="info-row" id="drive-info"></div>
            <div class="tracks" id="track-list"></div>
        </section>

        <section class="page hidden" id="page-ranking">
            <div class="subtabs">
                <button class="sub active" data-sub="rating">Rating Top 50</button>
                <button class="sub" data-sub="times">Bestzeiten</button>
                <button class="sub" data-sub="recent">Letzte Rennen</button>
                <select id="times-track" class="hidden"></select>
            </div>
            <div class="table-wrap" id="ranking-content"></div>
        </section>

        <section class="page hidden" id="page-profile">
            <div id="profile-content"></div>
        </section>
    </div>

    <!-- Renn-HUD -->
    <div id="hud" class="hidden">
        <div class="hud-main">
            <div class="hud-track" id="hud-track"></div>
            <div class="hud-pos" id="hud-pos-wrap"><span id="hud-pos">1</span><small id="hud-count">/1</small></div>
            <div class="hud-grid">
                <div><label>Runde</label><span id="hud-lap">1/3</span></div>
                <div><label>Checkpoint</label><span id="hud-cp">0/0</span></div>
                <div><label>Rundenzeit</label><span id="hud-laptime" class="mono">0:00.000</span></div>
                <div id="hud-total-wrap"><label>Gesamtzeit</label><span id="hud-total" class="mono">0:00.000</span></div>
                <div><label>Beste Runde</label><span id="hud-best" class="mono">--:--.---</span></div>
                <div><label>Persönliche Bestzeit</label><span id="hud-pb" class="mono">--:--.---</span></div>
                <div><label>Streckenrekord</label><span id="hud-record" class="mono">--:--.---</span></div>
            </div>
            <div class="hud-hint">/kartleave zum Verlassen</div>
        </div>
        <div class="hud-speed"><span id="hud-speed">0</span><small>km/h</small></div>
        <div class="hud-table" id="hud-table"></div>
    </div>

    <div id="countdown" class="hidden"></div>
    <div id="lapflash" class="hidden"></div>
    <div id="banner" class="hidden"></div>
    <div id="notify"></div>

    <!-- Ergebnis -->
    <div id="result" class="panel hidden">
        <header class="menu-head">
            <div class="brand"><span class="flag"></span>ERGEBNIS</div>
            <button class="close" id="btn-result-close">✕</button>
        </header>
        <div id="result-content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
