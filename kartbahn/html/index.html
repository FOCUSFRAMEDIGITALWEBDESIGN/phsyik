<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kartbahn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ================= MENÜ ================= -->
    <div id="menu" class="panel menu hidden">
        <aside class="side">
            <div class="brand">
                <span class="flag"></span>
                <div><b>KART</b><i>BAHN</i></div>
            </div>
            <nav class="tabs">
                <button class="tab active" data-tab="drive"><span class="ico">🏁</span>Fahren</button>
                <button class="tab" data-tab="ranking"><span class="ico">🏆</span>Rangliste</button>
                <button class="tab" data-tab="profile"><span class="ico">👤</span>Profil</button>
            </nav>
            <div class="side-foot" id="side-foot"></div>
        </aside>
        <main class="content">
            <header class="top">
                <div class="top-title" id="top-title">Fahren</div>
                <div class="head-profile" id="head-profile"></div>
                <button class="close" id="btn-close" title="Schließen">✕</button>
            </header>

            <section class="page" id="page-drive">
                <div class="info-row" id="drive-info"></div>
                <div class="tracks" id="track-list"></div>
            </section>

            <section class="page hidden" id="page-ranking">
                <div class="subtabs">
                    <button class="sub active" data-sub="rating">Rating</button>
                    <button class="sub" data-sub="season">Meisterschaft</button>
                    <button class="sub" data-sub="times">Bestzeiten</button>
                    <button class="sub" data-sub="recent">Letzte Rennen</button>
                    <select id="times-track" class="inp hidden"></select>
                </div>
                <div class="table-wrap" id="ranking-content"></div>
            </section>

            <section class="page hidden" id="page-profile">
                <div id="profile-content"></div>
            </section>
        </main>
    </div>

    <!-- ================= RENN-HUD ================= -->
    <div id="hud" class="hidden">
        <!-- oben rechts: Rennen -->
        <div class="hud-main">
            <div class="hud-head">
                <div class="hud-track" id="hud-track"></div>
                <div class="hud-team hidden" id="hud-team"></div>
            </div>
            <div class="hud-row">
                <div class="hud-pos" id="hud-pos-wrap"><small>POS</small><span id="hud-pos">1</span><em id="hud-count">/1</em></div>
                <div class="hud-lapbox">
                    <small>RUNDE</small><span id="hud-lap">1/3</span>
                    <small>CP</small><span id="hud-cp">0/0</span>
                </div>
            </div>
            <div class="hud-timer">
                <div><label>Rundenzeit</label><span id="hud-laptime" class="mono big">0:00.000</span></div>
                <div class="delta-box"><label>Delta</label><span id="hud-delta" class="mono">–</span></div>
            </div>
            <div class="sectors" id="hud-sectors"></div>
            <div class="hud-grid">
                <div id="hud-total-wrap"><label>Gesamt</label><span id="hud-total" class="mono">0:00.000</span></div>
                <div><label>Beste Runde</label><span id="hud-best" class="mono">--:--.---</span></div>
                <div><label>Bestzeit (PB)</label><span id="hud-pb" class="mono pb">--:--.---</span></div>
                <div><label>Rekord</label><span id="hud-record" class="mono rec">--:--.---</span></div>
            </div>
            <div class="hud-ghost hidden" id="hud-ghost"></div>
            <div class="hud-hint"><kbd>/kartleave</kbd> verlassen · <kbd>/kartreset</kbd> zurücksetzen</div>
        </div>

        <!-- unten rechts: Tacho -->
        <div class="hud-speed">
            <div class="tags">
                <div class="slip hidden" id="hud-slip">WINDSCHATTEN</div>
                <div class="shield hidden" id="hud-shield">SCHILD</div>
            </div>
            <div class="gauge">
                <svg viewBox="0 0 200 200">
                    <path class="g-bg" d="M 34 150 A 80 80 0 1 1 166 150"/>
                    <path class="g-fg" id="gauge-arc" d="M 34 150 A 80 80 0 1 1 166 150"/>
                </svg>
                <div class="g-val"><span id="hud-speed">0</span><small>km/h</small></div>
            </div>
            <div class="boost hidden" id="hud-boost">
                <label><span>BOOST</span><kbd>Shift</kbd></label>
                <div class="bar"><div id="hud-boost-fill"></div><i></i></div>
            </div>
        </div>

        <div class="item-slot hidden" id="hud-item"><small>ITEM</small><span id="hud-item-name">–</span><kbd>G</kbd></div>
        <div class="hud-table" id="hud-table"></div>
        <svg class="minimap hidden" id="minimap" viewBox="0 0 200 200"></svg>
    </div>

    <!-- Zuschauer -->
    <div id="spectate" class="hidden">
        <div class="spec-box"><small>👁 ZUSCHAUER · <span id="spec-track"></span></small><b id="spec-name">–</b><span id="spec-idx"></span></div>
    </div>

    <!-- Siegerpodest -->
    <div id="podium" class="hidden">
        <div class="pod p2"><small>2</small><b id="pod-2"></b></div>
        <div class="pod p1"><small>1</small><b id="pod-1"></b></div>
        <div class="pod p3"><small>3</small><b id="pod-3"></b></div>
    </div>

    <div id="countdown" class="hidden"></div>
    <div id="lapflash" class="hidden"></div>
    <div id="banner" class="hidden"></div>
    <div id="notify"></div>

    <!-- Ergebnis -->
    <div id="result" class="panel result hidden">
        <header class="top">
            <div class="brand small"><span class="flag"></span><div><b>ERGEB</b><i>NIS</i></div></div>
            <button class="close" id="btn-result-close">✕</button>
        </header>
        <div id="result-content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
